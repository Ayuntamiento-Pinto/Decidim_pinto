    help:
      participatory_spaces:
        assemblies:
          contextual: "<p>Una <strong>asamblea</strong> es un grupo formado por miembros
            de una organización que se reúnen periódicamente para tomar decisiones
            sobre un ámbito o área específica de la misma.</p><p>Los espacios de participación realizan
            encuentros, algunos son privados y otros son abiertos. Si son abiertos
            se puede participar en ellos (por ejemplo: asistiendo si el aforo lo permite,
            añadiendo puntos al orden del día, o comentando las propuestas y decisiones
            tomadas por dicho órgano).</p> <p>Ejemplos: Un espacio de participación general (que
            se reúne una vez al año para definir las líneas principales de acción
            de la organización así como para escojer a sus órganos ejecutivos por
            votación), una consejo asesor de igualdad (que se reúne cada dos meses
            para realizar propuestas de cómo mejorar las relaciones de género en la
            organización), una comisión de evaluación (que se reúne cada mes para
            realizar el seguimiento de un proceso) o un órgano de garantías (que recoge
            las Personalizacións, abusos o propuestas de mejora de los procedimientos de
            toma de decisiones) son todos ejemplos de espacios de participación.</p>\n"
          page: "<p>Un <strong>espacio de participación</strong> es un grupo formado por miembros
            de una organización que se reúnen periódicamente para tomar decisiones
            sobre un ámbito o área específica de la misma.</p><p>En los espacios de participación 
            se realizan encuentros, algunos son privados y otros son abiertos. Si son abiertos
            se puede participar en ellos (por ejemplo: asistiendo si el aforo lo permite,
            añadiendo puntos al orden del día, o comentando las propuestas y decisiones
            tomadas por dicho órgano).</p> <p>Ejemplos: Un espacio de participación general (que
            se reúne una vez al año para definir las líneas principales de acción
            de la organización así como para escojer a sus órganos ejecutivos por
            votación), una consejo asesor de igualdad (que se reúne cada dos meses
            para realizar propuestas de cómo mejorar las relaciones de género en la
            organización), una comisión de evaluación (que se reúne cada mes para
            realizar el seguimiento de un proceso) o un órgano de garantías (que recoge
            las Personalizacións, abusos o propuestas de mejora de los procedimientos de
            toma de decisiones) son todo ejemplos de espacios de participación.</p>\n"
          title: "¿Qué son espacios de participación?"
